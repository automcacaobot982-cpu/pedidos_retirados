<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Registro de Pedidos Retirados · Belt Correias</title>

    <!-- ===== Configuração do App (PWA) ===== -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0c353b">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Retirada">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg:#eceff1;
            --surface:#ffffff;
            --surface-2:#f6f8f9;
            --ink:#16191c;
            --ink-2:#586066;
            --ink-3:#8a939a;
            --line:#dde3e6;
            --line-2:#c9d2d6;
            --bar:#0c353b;
            --brand:#0d5b63;
            --brand-2:#0a474d;
            --brand-tint:#e2efef;
            --red:#cf3a2c;
            --red-tint:#fbe6e3;
            --green:#1a9455;
            --green-tint:#e2f3ea;
            --shadow-sm:0 1px 2px rgba(16,25,30,.08);
            --shadow-md:0 10px 30px rgba(12,42,48,.14);
            --r:12px;
            --r-sm:8px;
            --sans:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
            --num:'Space Grotesk','IBM Plex Sans',system-ui,sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--sans);
            background-color: var(--bg);
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
            line-height: 1.45;
            display: flex;
            flex-direction: column;
            min-height: 100dvh;
        }

        button { font-family: inherit; cursor: pointer; }
        input, select, textarea { font-family: inherit; }

        /* TOPBAR */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 40;
            background: var(--bar);
            color: #eaf6f5;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0 22px;
            height: 60px;
        }

        .topbar .mark {
            width: 34px;
            height: 34px;
            flex: 0 0 auto;
        }

        .topbar .tb-title {
            font-family: var(--num);
            font-weight: 600;
            font-size: 15px;
        }

        .topbar .tb-title small {
            display: block;
            font-family: var(--sans);
            font-weight: 400;
            font-size: 11px;
            color: #9ccbc7;
        }

        /* CONTEÚDO */
        main {
            flex: 1;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 32px 20px 48px;
        }

        .card {
            background-color: var(--surface);
            padding: 32px;
            border-radius: var(--r);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--line);
        }

        .card .eyebrow {
            color: var(--brand);
            font-weight: 600;
            font-size: 13px;
            margin: 0 0 6px;
        }

        .card h1 {
            font-family: var(--num);
            font-weight: 600;
            font-size: 24px;
            margin: 0 0 4px;
            color: var(--ink);
        }

        .card .sub {
            margin: 0 0 26px;
            color: var(--ink-2);
            font-size: 14px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--ink-2);
            margin-bottom: 7px;
        }

        .control {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid var(--line-2);
            border-radius: var(--r-sm);
            background: var(--surface-2);
            font-size: 16px;
            color: var(--ink);
            outline: none;
            transition: all .15s ease;
        }

        .control:focus {
            border-color: var(--brand);
            background-color: var(--surface);
            box-shadow: 0 0 0 3px rgba(13, 91, 99, 0.14);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            border: none;
            border-radius: var(--r-sm);
            font-weight: 600;
            font-size: 15px;
            padding: 13px 18px;
            transition: all .15s ease;
        }

        .btn:active { transform: scale(0.99); }

        .btn-primary {
            background: var(--brand);
            color: #fff;
        }

        .btn-primary:hover { background: var(--brand-2); }

        .btn-primary:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .btn-ghost {
            margin-top: 12px;
            background: var(--surface);
            color: var(--brand);
            border: 1px solid var(--line-2);
        }

        .btn-ghost:hover {
            background: var(--brand-tint);
            border-color: var(--brand);
        }

        .btn-ghost:disabled {
            background: var(--surface-2);
            color: var(--ink-3);
            border-color: var(--line);
            cursor: not-allowed;
        }

        .btn-icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .status-msg {
            margin-top: 20px;
            padding: 12px 14px;
            border-radius: var(--r-sm);
            font-size: 14px;
            text-align: center;
            display: none;
            font-weight: 500;
        }

        .status-msg.success {
            display: block;
            background-color: var(--green-tint);
            color: #15803d;
            border: 1px solid #bbf7d0;
        }

        .status-msg.error {
            display: block;
            background-color: var(--red-tint);
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid #ffffff;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== Leitor de código de barras (modal) ===== */
        .scanner-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(9, 28, 32, 0.55);
            backdrop-filter: blur(2px);
            z-index: 80;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .scanner-overlay.active {
            display: flex;
        }

        .scanner-box {
            background-color: var(--surface);
            border-radius: var(--r);
            width: 100%;
            max-width: 440px;
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        .scanner-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 22px;
            border-bottom: 1px solid var(--line);
        }

        .scanner-header h2 {
            font-family: var(--num);
            font-size: 18px;
            color: var(--ink);
            font-weight: 600;
        }

        .btn-close {
            width: auto;
            background: none;
            border: none;
            color: var(--ink-2);
            font-size: 28px;
            line-height: 1;
            padding: 0 4px;
            cursor: pointer;
        }

        .btn-close:hover { color: var(--ink); }

        .scanner-body {
            padding: 22px;
        }

        #reader {
            width: 100%;
            border-radius: var(--r-sm);
            overflow: hidden;
            background-color: #000000;
            min-height: 240px;
        }

        #reader video {
            width: 100% !important;
            border-radius: var(--r-sm);
        }

        .scanner-hint {
            text-align: center;
            font-size: 13px;
            color: var(--ink-2);
            margin: 16px 0;
        }

        .btn-cancel {
            background-color: var(--surface-2);
            color: var(--ink);
            border: 1px solid var(--line-2);
        }

        .btn-cancel:hover { background-color: var(--line); }
    </style>
</head>
<body>

    <header class="topbar">
        <svg class="mark" viewBox="0 0 64 64" fill="none">
            <rect width="64" height="64" rx="13" fill="#0a3a40"/>
            <g stroke="#7fd4d0" stroke-width="3"><circle cx="24" cy="32" r="12"/><circle cx="44" cy="32" r="8"/></g>
        </svg>
        <div class="tb-title">Belt Correias<small>Registro de Retirada</small></div>
    </header>

    <main>
        <div class="card">
            <p class="eyebrow">Expedição</p>
            <h1>Registrar Pedido Retirado</h1>
            <p class="sub">Digite o número do pedido para salvar na planilha</p>

            <form id="orderForm">
                <div class="field">
                    <label for="numeroPedido">Número do Pedido</label>
                    <input type="text" id="numeroPedido" class="control" placeholder="Ex: 10452" required autocomplete="off" inputmode="numeric" pattern="[0-9]*">
                </div>

                <button type="submit" id="btnRegistrar" class="btn btn-primary">
                    <span id="btnText">Registrar</span>
                </button>

                <button type="button" id="btnEscanear" class="btn btn-ghost">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
                        <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
                        <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
                        <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
                        <path d="M7 8v8M10.5 8v8M14 8v8M17 8v8"></path>
                    </svg>
                    <span>Escanear código de barras</span>
                </button>
            </form>

            <div id="statusMsg" class="status-msg"></div>
        </div>
    </main>

    <!-- Tela do leitor de código de barras -->
    <div id="scannerOverlay" class="scanner-overlay">
        <div class="scanner-box">
            <div class="scanner-header">
                <h2>Escanear Código</h2>
                <button type="button" id="btnFecharScanner" class="btn-close" aria-label="Fechar">&times;</button>
            </div>
            <div class="scanner-body">
                <div id="reader"></div>
                <p class="scanner-hint">Aponte a câmera para o código de barras do pedido</p>
                <button type="button" id="btnCancelarScanner" class="btn btn-cancel">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Biblioteca do leitor (arquivo local, funciona sem internet depois de instalado) -->
    <script src="./html5-qrcode.min.js"></script>

    <script>
        // URL DO SEU GOOGLE APPS SCRIPT CONFIGURADA
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw9a_KCboE6rlylIU3hC9oKyHUt86KVXhZWM1oOsvKiRru-iSMswJBVKxPmjVs4WfpW/exec';

        const form = document.getElementById('orderForm');
        const inputPedido = document.getElementById('numeroPedido');
        const btnRegistrar = document.getElementById('btnRegistrar');
        const btnText = document.getElementById('btnText');
        const statusMsg = document.getElementById('statusMsg');

        // Impede a digitação e colagem de caracteres que não sejam números
        inputPedido.addEventListener('input', function(e) {
            this.value = this.value.replace(/\D/g, '');
        });

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const pedido = inputPedido.value.trim();
            if (!pedido) return;

            setLoading(true);
            hideStatus();

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ numeroPedido: pedido })
                });

                const result = await response.json();

                if (result.status === 'success') {
                    showStatus('Pedido registrado com sucesso!', 'success');
                    inputPedido.value = '';
                    inputPedido.focus();
                } else {
                    showStatus('Erro ao registrar: ' + (result.message || 'Tente novamente.'), 'error');
                }
            } catch (error) {
                console.error('Erro:', error);
                showStatus('Erro de conexão ou URL inválida.', 'error');
            } finally {
                setLoading(false);
            }
        });

        function setLoading(isLoading) {
            btnRegistrar.disabled = isLoading;
            if (isLoading) {
                btnText.innerHTML = '<span class="spinner"></span> Registrando...';
            } else {
                btnText.textContent = 'Registrar';
            }
        }

        function showStatus(message, type) {
            statusMsg.textContent = message;
            statusMsg.className = `status-msg ${type}`;
            statusMsg.style.display = 'block';
        }

        function hideStatus() {
            statusMsg.style.display = 'none';
            statusMsg.className = 'status-msg';
        }

        // ===================================================================
        // LEITOR DE CÓDIGO DE BARRAS (CÂMERA DO CELULAR)
        // ===================================================================
        const btnEscanear = document.getElementById('btnEscanear');
        const scannerOverlay = document.getElementById('scannerOverlay');
        const btnFecharScanner = document.getElementById('btnFecharScanner');
        const btnCancelarScanner = document.getElementById('btnCancelarScanner');

        let html5QrCode = null;
        let scannerAtivo = false;
        let scannerCancelado = false;
        let leituraProcessada = false;
        let audioCtx = null;

        btnEscanear.addEventListener('click', abrirScanner);
        btnFecharScanner.addEventListener('click', fecharScanner);
        btnCancelarScanner.addEventListener('click', fecharScanner);
        scannerOverlay.addEventListener('click', function (e) {
            // Toque fora da caixa fecha o leitor
            if (e.target === scannerOverlay) fecharScanner();
        });

        async function abrirScanner() {
            if (typeof Html5Qrcode === 'undefined') {
                showStatus('O leitor não carregou. Verifique se o arquivo html5-qrcode.min.js está na mesma pasta.', 'error');
                return;
            }

            prepararAudio();
            hideStatus();
            leituraProcessada = false;
            scannerCancelado = false;
            scannerOverlay.classList.add('active');

            // Formatos de código reconhecidos (os mais comuns em etiquetas)
            const formatos = [
                Html5QrcodeSupportedFormats.CODE_128,
                Html5QrcodeSupportedFormats.CODE_39,
                Html5QrcodeSupportedFormats.CODE_93,
                Html5QrcodeSupportedFormats.ITF,
                Html5QrcodeSupportedFormats.CODABAR,
                Html5QrcodeSupportedFormats.EAN_13,
                Html5QrcodeSupportedFormats.EAN_8,
                Html5QrcodeSupportedFormats.UPC_A,
                Html5QrcodeSupportedFormats.UPC_E,
                Html5QrcodeSupportedFormats.QR_CODE
            ];

            html5QrCode = new Html5Qrcode('reader', { formatsToSupport: formatos, verbose: false });

            const config = {
                fps: 10,
                qrbox: function (larguraVisor, alturaVisor) {
                    const menorLado = Math.min(larguraVisor, alturaVisor);
                    const largura = Math.floor(menorLado * 0.85);
                    const altura = Math.floor(largura * 0.55); // retângulo (bom p/ código de barras)
                    return { width: largura, height: altura };
                }
            };

            try {
                await html5QrCode.start(
                    { facingMode: 'environment' }, // câmera traseira
                    config,
                    aoLerCodigo,
                    function () { /* ignora falhas de leitura quadro a quadro */ }
                );
                scannerAtivo = true;

                // Se o usuário cancelou enquanto a câmera abria, para na hora
                if (scannerCancelado) {
                    await pararScanner();
                }
            } catch (err) {
                console.error('Erro ao iniciar a câmera:', err);
                scannerOverlay.classList.remove('active');

                let msg = 'Não foi possível acessar a câmera.';
                if (err && (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError')) {
                    msg = 'Permissão da câmera negada. Autorize o acesso à câmera nas configurações e tente de novo.';
                } else if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
                    msg = 'A câmera só funciona em páginas seguras (https). Abra esta página por um endereço https:// e tente novamente.';
                } else if (err && err.name === 'NotFoundError') {
                    msg = 'Nenhuma câmera foi encontrada neste dispositivo.';
                }
                showStatus(msg, 'error');
                await pararScanner();
            }
        }

        function aoLerCodigo(textoLido) {
            if (leituraProcessada) return; // evita ler o mesmo código várias vezes
            leituraProcessada = true;

            tocarBip();
            if (navigator.vibrate) navigator.vibrate(200);

            // O campo é numérico, então mantém apenas os números lidos.
            // Se seus códigos tiverem letras, troque a linha abaixo por: inputPedido.value = textoLido.trim();
            const somenteNumeros = textoLido.replace(/\D/g, '');
            inputPedido.value = somenteNumeros || textoLido.trim();

            fecharScanner();
            showStatus('Código lido: ' + inputPedido.value + '. Confira e toque em Registrar.', 'success');

            // Para registrar automaticamente logo após o escaneamento, descomente a linha abaixo:
            // form.requestSubmit();
        }

        async function fecharScanner() {
            scannerCancelado = true;
            scannerOverlay.classList.remove('active');
            await pararScanner();
        }

        async function pararScanner() {
            if (html5QrCode) {
                try { await html5QrCode.stop(); } catch (e) { /* já estava parado */ }
                try { html5QrCode.clear(); } catch (e) { /* ignora */ }
            }
            scannerAtivo = false;
            html5QrCode = null;
        }

        // Prepara o som de "bip". Iniciado no toque do botão para funcionar também no iPhone.
        function prepararAudio() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch (e) { /* áudio indisponível neste aparelho */ }
        }

        function tocarBip() {
            try {
                if (!audioCtx) return;
                const oscilador = audioCtx.createOscillator();
                const ganho = audioCtx.createGain();
                oscilador.connect(ganho);
                ganho.connect(audioCtx.destination);
                oscilador.type = 'sine';
                oscilador.frequency.value = 880;
                ganho.gain.setValueAtTime(0.25, audioCtx.currentTime);
                oscilador.start();
                oscilador.stop(audioCtx.currentTime + 0.15);
            } catch (e) { /* ignora */ }
        }

        // ===================================================================
        // REGISTRO DO SERVICE WORKER (transforma a página em app instalável)
        // ===================================================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js')
                    .catch(function (err) { console.log('Service worker não registrado:', err); });
            });
        }
    </script>
</body>
</html>
